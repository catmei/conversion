name: Build CIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ConfigCI is available on this runner
        shell: powershell
        run: |
          $c = Get-Command ConvertFrom-CIPolicy -ErrorAction SilentlyContinue
          if (-not $c) {
            Write-Host "::error::ConvertFrom-CIPolicy is NOT available on this runner."
            exit 1
          }
          Write-Host "ConfigCI OK -> $($c.Source)"

      - name: Convert every policy XML to binary CIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $xmls = @(Get-ChildItem -Filter *.xml)
          if ($xmls.Count -eq 0) { throw "No policy XML found in repo root." }
          foreach ($x in $xmls) {
            $out = [IO.Path]::ChangeExtension($x.Name, '.cip')
            ConvertFrom-CIPolicy -XmlFilePath $x.FullName -BinaryFilePath $out
            Write-Host "$($x.Name) -> $out  ($((Get-Item $out).Length) bytes)"
          }

      - name: Upload the CIPs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-cip
          path: '*.cip'
          if-no-files-found: error
